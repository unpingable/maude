error_log stderr;
pid /tmp/maude-synthetic-nginx.pid;

events {}

http {
    upstream order-history-v1 {
        server 127.0.0.1:18081;
    }
    upstream order-history-v2 {
        server 127.0.0.1:18082;
    }
    server {
        listen 127.0.0.1:18080;
        include nginx/routes.conf;
    }
}
