apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-board
spec:
  template:
    spec:
      containers:
        - name: menu-board
          image: registry.example.invalid/menu-board:5.4.1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
